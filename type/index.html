<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>字体试排 · Syno Labs</title>
    <link rel="icon" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./picker.css" />
    <script type="module" src="./picker.js"></script>
  </head>
  <body>
    <main>
      <fieldset>
        <legend>首页字体试排</legend>
        <label style="--face: &quot;Figtree&quot;">
          <input type="radio" name="face" value="figtree" checked />
          <span class="sample" aria-hidden="true">Intent</span>
          <span class="name">Figtree <small>当前</small></span>
        </label>
        <label style="--face: &quot;Commissioner&quot;">
          <input type="radio" name="face" value="commissioner" />
          <span class="sample" aria-hidden="true">Intent</span>
          <span class="name">Commissioner</span>
        </label>
        <label style="--face: &quot;Source Sans 3&quot;">
          <input type="radio" name="face" value="source-sans-3" />
          <span class="sample" aria-hidden="true">Intent</span>
          <span class="name">Source Sans 3</span>
        </label>
        <label style="--face: &quot;Manrope&quot;">
          <input type="radio" name="face" value="manrope" />
          <span class="sample" aria-hidden="true">Intent</span>
          <span class="name">Manrope</span>
        </label>
      </fieldset>
      <iframe src="/" title="Syno Labs 官网字体预览"></iframe>
    </main>
  </body>
</html>
